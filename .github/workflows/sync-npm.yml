name: Sync And Publish NPM Package

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Specific npm version to sync. Leave empty to use the dist-tag.
        required: false
        type: string
      dist_tag:
        description: npm dist-tag to sync when no explicit version is provided.
        required: false
        default: latest
        type: string
  schedule:
    - cron: '0 9 * * *'

concurrency:
  group: sync-npm
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync repository from npm
        env:
          NPM_SYNC_VERSION: ${{ inputs.version }}
          NPM_SYNC_DIST_TAG: ${{ inputs.dist_tag }}
          NPM_SYNC_PRESERVE_PATHS: .git,.github,node_modules,.env,scripts
        run: node ./scripts/sync-from-npm.mjs

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read synced version
        if: steps.changes.outputs.changed == 'true'
        id: version
        run: echo "value=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync npm package v${{ steps.version.outputs.value }}"

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: git push

  publish:
    if: github.event_name == 'release' || (github.event_name == 'push' && github.actor != 'github-actions[bot]')
    runs-on: ubuntu-latest
    environment: .env
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Bump patch version on main pushes
        if: github.event_name == 'push'
        id: bump_version
        run: |
          npm version patch --no-git-tag-version
          echo "package_version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

      - name: Check published version
        id: version_check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=$(npm view fetch-page-assets version 2>/dev/null || true)
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "published_version=$PUBLISHED_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$PACKAGE_VERSION" = "$PUBLISHED_VERSION" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.version_check.outputs.should_publish == 'true'
        run: npm publish --provenance --access public

      - name: Commit version bump
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release fetch-page-assets v${{ steps.version_check.outputs.package_version }}" || echo "No version changes to commit"

      - name: Push version bump
        if: github.event_name == 'push'
        run: git push
